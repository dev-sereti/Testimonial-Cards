<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonial Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="wrap">
        <h1 class="sr-only">Testimonial</h1>
        <section class="grid">
            <article class="card-dark-quote">
                <p>
                    I have been solving all the project ideas on roadmap.sh and I am
                    surprised how far I have come from where I started. Highly recommended!
                </p>
                <div class="author-popout">
                    <img class="avatar" src="https://i.pravatar.cc/120?img=12" alt="Jones">
                    <div>
                        <div class="name">Artem Jones</div>
                        <div class="title">Junior Frontend Developer</div>
                    </div>
                </div>

            </article>

        </section>

    </main>
    
</body>
</html>
